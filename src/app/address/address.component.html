<div class="address-page-container">
    <form class="address-form">
        <div class="form-field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="Enter first name">
        </div>
        <div class="form-field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" placeholder="Enter last name">
        </div>
        <div class="form-field">
            <label for="email-id">Email ID</label>
            <input type="email" id="email-id" placeholder="Enter email id">
        </div>
        <div class="form-field">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter full address">
        </div>
        <div class="form-field">
            <label for="pincode">Pincode</label>
            <input type="number" id="pincode" placeholder="Enter pincode">
        </div>
        <div class="form-field">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Enter city name">
        </div>
        <div class="form-field">
            <label for="state">State</label>
            <input type="text" id="state" placeholder="Enter state name">
        </div>
        <div class="form-field">
            <label for="country">Country</label>
            <input type="text" id="country" placeholder="Enter country name">
        </div>
    </form>

    <section class="order-section">
        <div class="total-amount-container">
            <p class="total-amount-label">Total Amount</p>
            <p class="total-amount-value">10 Items | &#8377; 120</p>
        </div>
        <div class="order-button-container">
            <button class="primary-button">Login & Proceed</button>
        </div>
    </section>
</div>
